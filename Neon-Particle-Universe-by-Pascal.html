
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Universe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      overflow: hidden;
      background: #050510;
      color: white;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
    }

    .hud {
      position: fixed;
      top: 30px;
      left: 30px;
      z-index: 2;
      pointer-events: none;
    }

    h1 {
      font-size: clamp(25px, 5vw, 48px);
      letter-spacing: 5px;
      color: #72faff;
      text-shadow: 0 0 20px #00cfff;
    }

    p {
      margin-top: 12px;
      color: #b6c9ff;
      font-size: 14px;
    }

    .hint {
      position: fixed;
      bottom: 25px;
      width: 100%;
      text-align: center;
      color: #8a9dca;
      font-size: 13px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="universe"></canvas>

  <div class="hud">
    <h1>NEON UNIVERSE</h1>
    <p>Explore the digital cosmos.</p>
    <p id="count">Particles: loading...</p>
  </div>

  <div class="hint">
    MOVE YOUR MOUSE TO BEND SPACE · CLICK TO CREATE AN EXPLOSION
  </div>

  <script>
    const canvas = document.getElementById("universe");
    const ctx = canvas.getContext("2d");
    const counter = document.getElementById("count");

    let width, height, particles = [];
    const mouse = { x: -1000, y: -1000 };
    const colors = ["#00f5ff", "#8b5cf6", "#ff38c7", "#ffffff"];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      createParticles();
    }

    class Particle {
      constructor(x, y, explosion = false) {
        this.x = x ?? Math.random() * width;
        this.y = y ?? Math.random() * height;
        this.vx = explosion
          ? (Math.random() - 0.5) * 12
          : (Math.random() - 0.5) * 0.8;
        this.vy = explosion
          ? (Math.random() - 0.5) * 12
          : (Math.random() - 0.5) * 0.8;
        this.radius = Math.random() * 2 + 0.7;
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.life = explosion ? 100 : Infinity;
      }

      update() {
        const dx = mouse.x - this.x;
        const dy = mouse.y - this.y;
        const distance = Math.hypot(dx, dy);

        // Mouse gravity
        if (distance < 150 && distance > 0) {
          const force = (150 - distance) / 1500;
          this.vx += dx * force * 0.08;
          this.vy += dy * force * 0.08;
        }

        this.x += this.vx;
        this.y += this.vy;

        // Friction
        this.vx *= 0.99;
        this.vy *= 0.99;

        // Wrap around screen
        if (this.x < 0) this.x = width;
        if (this.x > width) this.x = 0;
        if (this.y < 0) this.y = height;
        if (this.y > height) this.y = 0;

        if (this.life !== Infinity) this.life--;
      }

      draw() {
        ctx.globalAlpha = this.life === Infinity
          ? 1 : Math.max(0, this.life / 100);

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 12;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
      }
    }

    function createParticles() {
      particles = Array.from(
        { length: Math.min(180, Math.floor(width * height / 6500)) },
        () => new Particle()
      );
      counter.textContent = `Particles: ${particles.length}`;
    }

    function explode(x, y) {
      for (let i = 0; i < 45; i++) {
        particles.push(new Particle(x, y, true));
      }
    }

    function animate() {
      ctx.fillStyle = "rgba(5, 5, 16, 0.22)";
      ctx.fillRect(0, 0, width, height);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw();

        if (p.life <= 0) particles.splice(i, 1);
      }

      // Connect nearby particles with glowing lines
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const a = particles[i];
          const b = particles[j];
          const distance = Math.hypot(a.x - b.x, a.y - b.y);

          if (distance < 100) {
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = `rgba(0, 210, 255, ${
              (1 - distance / 100) * 0.3
            })`;
            ctx.lineWidth = 0.6;
            ctx.stroke();
          }
        }
      }

      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", resize);

    window.addEventListener("mousemove", e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    window.addEventListener("touchmove", e => {
      mouse.x = e.touches[0].clientX;
      mouse.y = e.touches[0].clientY;
    }, { passive: true });

    window.addEventListener("click", e => {
      explode(e.clientX, e.clientY);
    });

    resize();
    animate();
  </script>
</body>
</html>
