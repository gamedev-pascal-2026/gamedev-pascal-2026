
<!DOCTYPE html>
<html>
<head>
<h1 align=center>t2a18-game-template-Pascal</h1>
<style>
body {
    background-image: url('https://i.pinimg.com/originals/0b/b9/c5/0bb9c503f11cd2cf7647919af57d69fa.png');
    background-repeat: repeat-x;
    background-size: auto 500px;
    background-position: 0px 0px;
    overflow: hidden;
    font-family: Arial;
}

h1 {
    text-align: center;
    color: white;
}

#myScore {
    color: white;
}

#gameArea {
    position: relative;
    width: 100%;
    height: 350px;
    overflow: hidden;
}

button {
    padding: 12px;
    margin: 5px;
    font-size: 16px;
    cursor: pointer;
}
</style>
</head>

<body id="myBody">

<h1>Tom and Jerry Game</h1>

<h2 id="myScore">Score: 0</h2>

<div id="gameArea">

    <!-- Jerry -->
    <img id="myImg01"
    style="position:absolute; width:100px; height:100px; top:100px; left:50px;"
    src="https://clipart-library.com/2023/tom-and-jerry-32-992x1024.png">

    <!-- Tom -->
    <img id="myImg02"
    style="position:absolute; width:100px; height:100px; top:100px; left:350px;"
    src="https://tse2.mm.bing.net/th/id/OIP.9rJaK0q94N76hWXmR8CrKQHaE6?r=0&rs=1&pid=ImgDetMain&o=7&rm=3">

</div>

<br>

<button onclick="myMoveRight()">
Move Jerry Right
</button>

<button onclick="myMoveLeft()">
Move Tom Left
</button>

<button onclick="myBackgroundMove()">
Auto Background Left
</button>

<button onclick="location.reload()">
Restart Game
</button>

<script>

// Global variables
let myGlobalX = 0;
let myClock;
let myScore = 0;

// Collision detection
function myHitOther(my1, my2) {

    let img1 = document.getElementById(my1);
    let img2 = document.getElementById(my2);

    let rect1 = img1.getBoundingClientRect();
    let rect2 = img2.getBoundingClientRect();

    return (
        rect1.right >= rect2.left &&
        rect1.bottom >= rect2.top &&
        rect1.left <= rect2.right &&
        rect1.top <= rect2.bottom
    );
}

// Check collision
function myCheckHit() {

    if (myHitOther('myImg01', 'myImg02')) {

        clearInterval(myClock);

        alert('You lose! Tom caught Jerry!');

        document.getElementById('myImg01').style.left = '50px';
        document.getElementById('myImg02').style.left = '350px';

        myScore = 0;

        document.getElementById('myScore').innerHTML = 'Score: 0';
    }
}

// Move Jerry right
function myMoveRight() {

    let jerry = document.getElementById('myImg01');

    jerry.style.left =
    (parseInt(jerry.style.left) + 10) + 'px';

    myScore++;

    document.getElementById('myScore').innerHTML =
    'Score: ' + myScore;

    myCheckHit();
}

// Move Tom left
function myMoveLeft() {

    let tom = document.getElementById('myImg02');

    tom.style.left =
    (parseInt(tom.style.left) - 10) + 'px';

    myCheckHit();
}

// Move background automatically to the left
function myBackgroundMove() {

    clearInterval(myClock);

    myClock = setInterval(function() {

        myGlobalX -= 2;

        document.getElementById('myBody').style.backgroundPosition =
        myGlobalX + 'px 0px';

    }, 50);
}

</script>

</body>
</html>
