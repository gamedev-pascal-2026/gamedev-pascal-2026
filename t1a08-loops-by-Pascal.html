<h4>Example working code</h4>

Max loops:
<input id="myNum01" type="number" value="4">
<br>

Weird number:
<input id="myWeird" type="number" value="2">
<br><br>

<input type="button"
value="Basic Loop with Decisions"
onclick="
document.getElementById('myDiv01').innerHTML = '';

let myTemp = '';
let myMax = parseInt(document.getElementById('myNum01').value);
let myWeird = parseInt(document.getElementById('myWeird').value);

for (let myLoop = 0; myLoop < myMax; myLoop++) {
    if (myLoop % myWeird === 0) {
        myTemp += 'Cool ';
        myTemp += 'Loop number: ' + myLoop + '<br>';
    }
}

document.getElementById('myDiv01').innerHTML = myTemp;
">

<input type="button"
value="Even Number Identifier"
onclick="
document.getElementById('myDiv01').innerHTML = '';

let myTemp = '';
let myMax = parseInt(document.getElementById('myNum01').value);

for (let myLoop = 0; myLoop < myMax; myLoop++) {
    if (myLoop % 2 === 0) {
        myTemp += 'Even Number, ';
        myTemp += 'Loop number: ' + myLoop + '<br>';
    }
}

document.getElementById('myDiv01').innerHTML = myTemp;
">

<div id="myDiv01">
    <font color="red">...</font>
</div>
